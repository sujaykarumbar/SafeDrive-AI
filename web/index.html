    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeDrive AI — Driver Safety & Hazard Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet CSS & JS for vector mapping fallback -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Google Maps Platform Loader: connects securely via backend config -->
    <script>
      (function() {
        const apiHost = window.location.hostname === 'localhost' ? 'http://localhost:8000' : `http://${window.location.hostname}:8000`;
        fetch(apiHost + '/api/v1/routes/config')
          .then(r => r.json())
          .then(cfg => {
            if (cfg && cfg.client_api_key && cfg.client_api_key.trim()) {
              const s = document.createElement('script');
              s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(cfg.client_api_key) + '&libraries=places,geometry';
              s.async = true;
              s.defer = true;
              document.head.appendChild(s);
            }
          })
          .catch(() => {});
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
