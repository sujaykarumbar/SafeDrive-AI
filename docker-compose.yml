version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: safedrive-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safedrive_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safedrive_pass}
      POSTGRES_DB: ${POSTGRES_DB:-safedrive_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safedrive_user -d safedrive_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: safedrive-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safedrive-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://safedrive_user:safedrive_pass@db:5432/safedrive_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-safedrive-super-secret-development-key-change-in-production-2026}
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  pgdata:
